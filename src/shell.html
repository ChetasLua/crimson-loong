<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>赤龍 · Crimson Loong</title>
<style>
html,body{margin:0;height:100%;background:#0a0506;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;cursor:default}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#2a0b0c 0%,#0a0506 70%);color:#e9c9a4;font:500 13px/1.4 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.22em;transition:opacity 1.2s;z-index:5}
#ld b{font-size:64px;font-weight:600;letter-spacing:.12em;color:#d8322a;text-shadow:0 0 40px rgba(216,50,42,.45);margin-bottom:14px}
#ld i{font-style:normal;opacity:.7;text-transform:uppercase;font-family:-apple-system,system-ui,sans-serif;font-size:11px}
#bar{width:220px;height:1px;background:rgba(233,201,164,.18);margin:26px 0 12px;position:relative}
#bar s{position:absolute;left:0;top:0;height:1px;width:0;background:#e9a15c;box-shadow:0 0 8px #e9a15c}
#st{font:500 10px/1 -apple-system,system-ui,sans-serif;opacity:.5;letter-spacing:.2em;text-transform:uppercase}
#snd{position:fixed;right:18px;bottom:16px;font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.08em;color:#f3d9bd;background:rgba(40,10,10,.42);padding:9px 13px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(243,217,189,.18);transition:opacity .8s;pointer-events:none;opacity:0;z-index:4}
#cr{position:fixed;left:18px;bottom:18px;font:500 10px/1 -apple-system,system-ui,sans-serif;letter-spacing:.14em;color:rgba(243,217,189,.42);text-transform:uppercase;pointer-events:none;transition:opacity 2s;opacity:0;z-index:4;max-width:calc(100vw - 200px)}
@media (max-width:700px){#cr{bottom:58px;max-width:calc(100vw - 36px);line-height:1.6}}
</style></head>
<body><canvas id="c"></canvas>
<div id="ld"><b>赤龍</b><i>Crimson Loong</i><div id="bar"><s></s></div><div id="st">waking</div></div>
<div id="snd">click for sound</div>
<div id="cr">pure three.js · every mesh, texture and note is code · after @scottstts’ Dragon’s Nest</div>

</script></body></html>
