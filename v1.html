  return { start, play, time, toggle, get playing() { return playing; }, get muted() { return muted; } };
})();

// ===== 88_film.js =====

// ---- the film: one 60 s take. Every picture and sound event reads these constants --------------------
const Film = (() => {
  const DUR = 60;
  const T = { EMERGE: 12.0, DRUMS: 18.0, CHARGE: 34.4, ROAR: 37.5, ROAR_END: 40.9, FINALE: 42.0, GONG: 54.0, OUT: 56.6 };
  const post = { fade: 1, exposure: 1, shake: 0, flash: 0, god: 0.55, bloom: 0.06 };
  const ease = t => sm(-8, DUR + 6, t);
  // gust strength (0..1+) and its integral (so leaves speed up without jumping)
  const gust = t => 0.10 + 0.06 * Math.sin(t * 0.37) + 0.5 * pulse(t, T.EMERGE + 1.2, 1.6, 3.2) + 0.25 * pulse(t, T.DRUMS + 5, 2, 4) + 1.0 * pulse(t, T.ROAR + 0.12, 0.28, 2.6) + 0.3 * pulse(t, 47, 2, 5);
  const WN = DUR * 60 + 2, wtab = new Float32Array(WN); for (let i = 1; i < WN; i++) wtab[i] = wtab[i - 1] + (0.9 + 2.4 * gust(i / 60)) / 60;
  const windPhase = t => { const x = clamp(t, 0, DUR) * 60, i = Math.min(WN - 2, x | 0); return lerp(wtab[i], wtab[i + 1], x - i); };
  const shakeAmt = t => pulse(t, T.ROAR, 0.22, 1.15) + 0.25 * pulse(t, T.DRUMS, 0.05, 0.5) + 0.3 * pulse(t, T.GONG, 0.05, 0.6);
  const P = new THREE.Vector3(), L = new THREE.Vector3(), m = new THREE.Matrix4(), UP = new THREE.Vector3(0, 1, 0), q2 = new THREE.Quaternion(), eu = new THREE.Euler();
  let lx = 0, ly = 0;
  const override = Q.get('cam') ? Q.get('cam').split(',').map(Number) : null;
  function apply(t, camera, look) {
    const e = ease(t), b = sm(T.CHARGE, T.ROAR + 0.4, t) * (1 - sm(T.ROAR_END, T.FINALE + 3, t));
    P.set(lerp(-5.5, -1.5, e) + Math.sin(t * 0.21) * 0.2, lerp(8.0, 13.2, e) + Math.sin(t * 0.33 + 1) * 0.1, lerp(81, 64, e));
    L.set(lerp(3.5, 1.5, e), lerp(38, 46, e) + b * 3, lerp(-40, -52, e));
    if (override) { P.set(override[0], override[1], override[2]); L.set(override[3], override[4], override[5]); }
    camera.position.copy(P); m.lookAt(P, L, UP); camera.quaternion.setFromRotationMatrix(m);
    // viewer nudge + handheld breath + roar shake
    if (look) { lx += (look.tx - lx) * 0.05; ly += (look.ty - ly) * 0.05; }
    const sh = shakeAmt(t);
    eu.set(-ly * 0.10 + Math.sin(t * 0.47) * 0.004 + sh * 0.010 * Math.sin(t * 71.3) * Math.sin(t * 13.1 + 1), -lx * 0.14 + Math.sin(t * 0.31 + 2) * 0.005 + sh * 0.008 * Math.sin(t * 63.7 + 2), Math.sin(t * 0.23) * 0.004 + sh * 0.012 * Math.sin(t * 57.1 + 4), 'YXZ');
    camera.quaternion.multiply(q2.setFromEuler(eu));
    camera.position.x += sh * 0.12 * Math.sin(t * 49.0); camera.position.y += sh * 0.14 * Math.sin(t * 61.0 + 1.3);
    // 16:9 keeps 58 deg vertical; taller windows keep the horizontal field instead
    const base = (override && override[6]) || lerp(54, 51.5, b), a169 = 16 / 9;
    camera.fov = camera.aspect >= a169 ? base : 2 * Math.atan(Math.tan(rad(base) / 2) * a169 / camera.aspect) * 180 / Math.PI;
    G.uGust.value = gust(t); G.uWind.value = windPhase(t);
    post.fade = sm(0.0, 2.8, t) * (1 - sm(T.OUT, DUR - 0.25, t));
    post.shake = sh; post.flash = pulse(t, T.ROAR + 0.05, 0.1, 0.6);
    post.exposure = 1.0 + 0.10 * pulse(t, T.ROAR + 0.05, 0.12, 0.8);
    post.bloom = 0.06 + 0.05 * pulse(t, T.ROAR, 0.2, 1.5);
  }
  return { DUR, T, apply, post, gust, windPhase, shakeAmt };
})();

// ===== 90_main.js =====

// ---- boot, loader, render loop, QA hooks -------------------------------------------------------------
(async () => {
  const canvas = document.getElementById('c'), $ = id => document.getElementById(id);
  const R = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false, depth: false });
  R.outputColorSpace = THREE.LinearSRGBColorSpace; R.toneMapping = THREE.NoToneMapping;
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.info.autoReset = false;
  const gl = R.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
  G.info.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?';
  const scene = new THREE.Scene(), fx = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xffffff, 0.001);          // only switches USE_FOG on; our chunk does the work
  const camera = new THREE.PerspectiveCamera(58, 16 / 9, 0.5, 6000);
  G.scene = scene; G.fx = fx; G.camera = camera; G.R = R;
  Post.init(R); Sky.init(R); scene.add(Sky.mesh);

  // sun + sky fill
  const sun = new THREE.DirectionalLight(SUN_COL, 6.3); sun.castShadow = true;
  const SC = new THREE.Vector3(0, 45, -40);
  sun.position.copy(SC).addScaledVector(SUN, 520); sun.target.position.copy(SC); scene.add(sun, sun.target);
  const sc = sun.shadow.camera; sc.left = -130; sc.right = 130; sc.top = 150; sc.bottom = -150; sc.near = 20; sc.far = 1100; sc.updateProjectionMatrix();
  sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.00035; sun.shadow.normalBias = 0.22; sun.shadow.radius = 2.2;
  G.sun = sun;
  const hemi = new THREE.HemisphereLight(new THREE.Color(0.44, 0.36, 0.64), new THREE.Color(0.50, 0.22, 0.15), 0.40); scene.add(hemi);

  // ---- sizing: device pixels, capped, 16:9 field of view kept (Vert+ on taller windows) ----
  let quality = 1, cssW = 0, cssH = 0;
  function resize() {
    cssW = innerWidth; cssH = innerHeight;
    const cap = Math.sqrt(3.7e6 / (cssW * cssH));
    const pr = CAPTURE ? +(Q.get('dpr') || 1) : Math.min(devicePixelRatio || 1, cap) * quality;
    R.setPixelRatio(pr); R.setSize(cssW, cssH, false);
    const v = R.getDrawingBufferSize(new THREE.Vector2()); Post.size(v.x, v.y);
    camera.aspect = cssW / cssH;
  }
  addEventListener('resize', resize); resize();

  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  // ---- staged build behind the loader ----
  const bar = $('bar').firstElementChild, st = $('st');
  const tick = () => new Promise(r => CAPTURE ? setTimeout(r, 0) : requestAnimationFrame(() => r()));
  const steps = [];
  const add = (label, w, fn) => steps.push({ label, w, fn });
  add('painting the sky', 30, async prog => { let p = 0; while (p < 1) { p = Sky.bakeStep(R, 40); prog(p); await tick(); } scene.environment = Sky.makeEnv(R); scene.environmentIntensity = 0.55;  Tex.init(R); });
  if (typeof Rock !== 'undefined') add('raising the mountains', 14, async prog => { await Rock.build(scene, prog, tick); });
  if (typeof Arch !== 'undefined') add('building the red halls', 8, async prog => { await Arch.build(scene, prog, tick); });
  if (typeof Flora !== 'undefined') add('growing maples and pines', 14, async prog => { await Flora.build(scene, prog, tick); });
  if (typeof Dragon !== 'undefined') add('waking the dragon', 14, async prog => { await Dragon.build(scene, fx, prog, tick); });
  if (typeof FX !== 'undefined') add('mist, water, leaves', 6, async prog => { await FX.build(scene, fx, prog, tick); });
  if (typeof Score !== 'undefined') add('tuning the erhu', 6, async prog => { Score.start(); });
  add('first light', 8, async prog => { frame(0); await tick(); frame(Film.DUR * 0.62); await tick(); });
  const tw = steps.reduce((a, s) => a + s.w, 0); let done = 0; const t0 = performance.now();
  for (const s of steps) {
    st.textContent = s.label; await tick();
    const ts = performance.now();
    await s.fn(p => { bar.style.width = ((done + s.w * p) / tw * 100).toFixed(1) + '%'; });
    done += s.w; bar.style.width = (done / tw * 100).toFixed(1) + '%';
    G.info[s.label] = Math.round(performance.now() - ts);
  }
  G.info.loadMs = Math.round(performance.now() - t0);

  // ---- frame ----
  addEventListener('pointermove', e => { look.tx = (e.clientX / innerWidth - 0.5); look.ty = (e.clientY / innerHeight - 0.5); });
  function frame(t, dt = 1 / 60) {
    G.t = t; G.uTime.value = t;
    Film.apply(t, camera, look);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
    for (const f of G.tick) f(t, dt);
    Sky.update(camera, t);
    R.info.reset();
    Post.render(scene, fx, camera, Film.post);
  }
  window.__renderFrame = n => { frame(n / 60); return true; };
  window.__frameAt = t => { frame(t); return true; };
  window.__dbg = { G, scene, fx, camera, R, Post, Sky, frame, get info() { return { ...G.info, calls: R.info.render.calls, tris: R.info.render.triangles, w: Post.W, h: Post.H }; } };
  window.__INFO = G.info;

  // ---- clock: free-running until sound starts, then locked to the audio clock ----
  let tStart = performance.now() / 1000 - (+(Q.get('t') || 0)), paused = Q.has('pause'), last = 0, acc = 0, nfr = 0, slow = 0, fcount = 0;
  const now = () => (typeof Score !== 'undefined' && Score.playing) ? Score.time() : ((performance.now() / 1000 - tStart) % Film.DUR + Film.DUR) % Film.DUR;
  function loop() {
    requestAnimationFrame(loop);
    const t = paused ? +(Q.get('t') || 0) : now(), ms = performance.now();
    R.shadowMap.autoUpdate = false; R.shadowMap.needsUpdate = (fcount++ & 1) === 0;       // shadows refresh every other frame
    frame(t, Math.min(0.1, (ms - last) / 1000 || 1 / 60));
    // adaptive resolution: hold 60 fps
    if (last) { acc += ms - last; nfr++; if (nfr >= 45) { const avg = acc / nfr; acc = 0; nfr = 0; if (avg > 19.5 && quality > 0.5) { if (++slow >= 2) { quality = Math.max(0.5, quality * 0.86); slow = 0; resize(); } } else slow = 0; G.info.ms = +avg.toFixed(1); G.info.quality = +quality.toFixed(2); } }
    last = ms;
  }
  const snd = $('snd'), ld = $('ld'), cr = $('cr');
  if (CAPTURE) ld.remove(); else { ld.style.opacity = 0; setTimeout(() => ld.remove(), 1300); }
  if (!CAPTURE) {
    snd.style.opacity = 1; cr.style.opacity = 1; setTimeout(() => { cr.style.opacity = 0; }, 9000);
    const go = async () => {
      if (typeof Score === 'undefined') return;
      if (Score.playing) { Score.toggle(); snd.textContent = Score.muted ? 'sound off' : 'sound on'; snd.style.opacity = 1; setTimeout(() => snd.style.opacity = 0, 1200); return; }
      snd.textContent = 'tuning…'; await Score.play(now); snd.textContent = 'sound on'; setTimeout(() => snd.style.opacity = 0, 1500);
    };
    addEventListener('pointerdown', go); addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; if (!paused) tStart = performance.now() / 1000 - G.t; } else go(); });
    loop();
  }
  window.__READY = true;
})().catch(e => { console.error('BOOT', e && e.stack || e); const s = document.getElementById('st'); if (s) s.textContent = 'error: ' + (e && e.message || e); window.__ERR = String(e && e.stack || e); });

</script></body></html>
